name: Publier le système

# Pousser un tag vX.Y.Z crée la release et y joint system.json + asoiaf.zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version et URL de téléchargement dans system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/asoiaf.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' system.json > system.tmp
          mv system.tmp system.json

      - name: Archive
        run: zip -r asoiaf.zip system.json module templates styles lang README.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            asoiaf.zip
          make_latest: true
